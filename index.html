<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Music Player</title>
    <style>
        body {
            background-color: #111;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #app {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <script src="https://unpkg.com/webamp@1.4.2/built/webamp.bundle.min.js"></script>
    
    <script>
        const Webamp = window.Webamp;
        const webamp = new Webamp({
            initialSkin: {
                url: "./The_Simple_v2.wsz"
            },
            initialTracks: [
                { metaData: { title: "As It Was", artist: "Harry Styles" }, url: "./As It Was .mp3" },
                { metaData: { title: "Get Up", artist: "NewJeans" }, url: "./Get Up.mp3" },
                { metaData: { title: "Bubble Gum", artist: "NewJeans" }, url: "./Bubble Gum.mp3" },
                { metaData: { title: "Supernatural", artist: "NewJeans" }, url: "./Supernatural.mp3" },
                { metaData: { title: "Hype Boy", artist: "NewJeans" }, url: "./Hype Boy.mp3" },
                { metaData: { title: "Sex, Drugs, Etc.", artist: "Beach Weather" }, url: "./Sex, Drugs, Etc. .mp3" },
                { metaData: { title: "Love Me Not", artist: "Rayven Lenae" }, url: "./Love Me Not .mp3" },
                { metaData: { title: "Sweater Weather", artist: "The Neighbourhood" }, url: "./Sweater Weather .mp3" },
                { metaData: { title: "Cruel Summer", artist: "Taylor Swift" }, url: "./Cruel Summer .mp3" },
                { metaData: { title: "There's Nothing Holdin' Me Back", artist: "Shawn Mendes" }, url: "./There's Nothing Holdin' Me Back .mp3" },
                { metaData: { title: "Super Shy", artist: "NewJeans" }, url: "./Super Shy .mp3" },
                { metaData: { title: "Gameboy", artist: "KATSEYE" }, url: "./Gameboy .mp3" },
                { metaData: { title: "Dancing Queen", artist: "ABBA" }, url: "./Dancing Queen .mp3" },
                { metaData: { title: "Honeypie", artist: "JAWNY" }, url: "./Honeypie .mp3" }
            ],
        });

        webamp.renderWhenReady(document.getElementById('app'));
    </script>
</body>
</html>
